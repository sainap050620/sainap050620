<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Saina Pattanayak, Data Science M.Sc. student at TU Hamburg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .name { font: 700 44px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .sub  { font: 400 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .tag  { opacity: 0; animation: cycle 12s infinite; }
      .t1 { animation-delay: 0s; } .t2 { animation-delay: 4s; } .t3 { animation-delay: 8s; }
      @keyframes cycle {
        0% { opacity: 0; transform: translateY(8px); }
        6%, 30% { opacity: 1; transform: translateY(0); }
        36%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      .dot { animation: float 6s ease-in-out infinite; }
      .d2 { animation-delay: -2s; } .d3 { animation-delay: -4s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      .bar { transform-origin: left; animation: grow 3s ease-out forwards; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { .tag, .dot, .bar { animation: none; } .t1 { opacity: 1; } }
    </style>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <g opacity="0.25" fill="none" stroke="#94a3b8" stroke-width="1">
    <path d="M0 170 H900 M0 130 H900 M0 90 H900"/>
  </g>
  <circle class="dot" cx="780" cy="60" r="34" fill="#38bdf8" opacity="0.18"/>
  <circle class="dot d2" cx="840" cy="140" r="20" fill="#34d399" opacity="0.22"/>
  <circle class="dot d3" cx="700" cy="150" r="14" fill="#f8fafc" opacity="0.12"/>
  <text x="50" y="82" class="name">Hi, I'm Saina 👋</text>
  <rect class="bar" x="50" y="98" width="180" height="4" rx="2" fill="url(#accent)"/>
  <g transform="translate(50 150)">
    <text class="sub tag t1">Data Science M.Sc. student @ TU Hamburg</text>
    <text class="sub tag t2">Clean pipelines · honest metrics · useful dashboards</text>
    <text class="sub tag t3">Data engineering · analytics · applied ML</text>
  </g>
</svg>
